services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # My user uid / guid
    user: ${JELLYFIN_USER_ID}:${JELLYFIN_USER_ID}
    ports:
      - ${JELLYFIN_TCP_PORT}:${JELLYFIN_TCP_PORT}/tcp
      - ${JELLYFIN_UDP_PORT}:${JELLYFIN_UDP_PORT}/udp
    volumes:
      - ${JELLYFIN_CONFIG_PATH}:/config
      - ${JELLYFIN_CACHE_PATH}:/cache
      - type: bind
        source: ${JELLYFIN_MOVIES_PATH}
        target: /media/movies
        read_only: true
      - type: bind
        source: ${JELLYFIN_MUSIC_PATH}
        target: /media/music
        read_only: true
      - type: bind
        source: ${JELLYFIN_TVSERIES_PATH}
        target: /media/tvseries
        read_only: true
    env_file: 
      - .env
    restart: 'unless-stopped' 
